# What goes into a distributable build.
#
# Only `out/` is needed at run time: the sources it was built from, the test
# fixtures and the tsconfigs are not, and shipping them makes the app several
# times the size it needs to be while handing every user a copy of the working
# tree. Production dependencies are gathered by electron-builder itself.
appId: dev.timcourt.rehearsal-space
productName: Rehearsal Space
copyright: © Tim Court

# A file that is going to be downloaded and typed at a shell prompt, so no
# spaces in it: the product name is for the desktop, not for the filename.
# The platform and processor are in the name because a release holds a file
# for each, and "which one do I want" should be answerable from the name.
artifactName: ${name}-${version}-${os}-${arch}.${ext}

directories:
  buildResources: build
  output: dist

files:
  - out/**
  - package.json

# Nothing here is fetched at run time, and a rebuild should not reach the
# network for something it already has.
npmRebuild: false

linux:
  target:
    # One file to run from anywhere, and one that installs itself properly.
    # A .deb lays down the launcher and the icons where the desktop looks, so
    # an installed copy needs none of build/install-launcher.sh.
    - AppImage
    - deb
  # It is an audio tool, so it belongs with the audio tools rather than in
  # the drawer everything unclassified falls into.
  category: AudioVideo
  mimeTypes:
    - audio/flac
    - audio/mpeg
    - audio/ogg
    - audio/wav
  icon: build/icon.png
  # Names the installed .desktop entry after `desktopName` in package.json, so
  # that it matches the window class Electron sets. Desktop environments match
  # a running window to its launcher by that name, and without the two agreeing
  # the app shows a blank icon in the dock and will not group.
  syncDesktopName: true
  synopsis: Music practice and song-writing
  description: An all-in-one tool for music practice and song-writing.

deb:
  # Debian files audio software under sound; the default is "default".
  packageCategory: sound

mac:
  target:
    # A disk image per processor. Apple silicon and Intel are separate builds
    # rather than one universal binary, which would be both of them in one
    # file and twice the download for everybody.
    - target: dmg
      arch:
        - arm64
        - x64
  category: public.app-category.music
  # Signed with no identity, which is an ad-hoc signature: enough for the code
  # to run at all on Apple silicon, which refuses anything unsigned. It is not
  # a developer certificate, so macOS still holds the download in quarantine
  # until it is opened once from the context menu. Notarising needs a paid
  # account; set CSC_LINK and CSC_KEY_PASSWORD and this can go.
  identity: null

win:
  target:
    # One that installs, and one that does not.
    - target: nsis
      arch:
        - x64
    - target: zip
      arch:
        - x64

nsis:
  # Installs for the person running it, so no administrator prompt.
  perMachine: false
  oneClick: false
  allowToChangeInstallationDirectory: true

# Where a tagged build goes. Draft, so a release is looked at before anybody
# else sees it.
publish:
  provider: github
  releaseType: draft
