# Builds the app for every platform it runs on, and — for a tagged commit —
# puts the files on a draft release for that tag.
#
# Draft, so that nothing is published to anybody until it has been looked at:
# a build that packages is not the same as a build that works, and only two of
# these three platforms have ever been run on.
#
# The building is done three times over and the releasing exactly once. Three
# jobs each making their own release is a race: none of them can see a draft
# another has just made, so two of them make two, and the files end up split
# between releases with the same name. So the platforms build and hand their
# files over, and one job at the end puts them somewhere.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      # One platform failing should not take the other two down with it: the
      # ones that did build are still worth having.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            for: --linux
            name: linux
          # Both Macs are built here. Nothing in this app is compiled, so the
          # Intel build is the Intel Electron in a disk image, which an Apple
          # silicon machine can assemble perfectly well.
          - os: macos-latest
            for: --mac
            name: macos
          - os: windows-latest
            for: --win
            name: windows

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      # A release named for a version the app does not call itself would be
      # wrong in the one place nobody thinks to check.
      - name: The tag and the version agree
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          declared=$(node -p "require('./package.json').version")
          if [ "$tagged" != "$declared" ]; then
            echo "Tag $GITHUB_REF_NAME says $tagged; package.json says $declared." >&2
            exit 1
          fi

      - run: npm run build

      - name: Package
        shell: bash
        run: npx electron-builder ${{ matrix.for }} --publish never
        env:
          # Nothing here is signed with a real certificate, so there is no
          # keychain to go looking through. Adding CSC_LINK and
          # CSC_KEY_PASSWORD as secrets, and taking `identity: null` out of
          # electron-builder.yml, is what turns signing on.
          CSC_IDENTITY_AUTO_DISCOVERY: false
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}

      # Kept whether or not this is a release, so a run started by hand is
      # still something you can download and try. The blockmaps and the
      # latest*.yml beside them are for an updater this app does not have.
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.name }}
          if-no-files-found: error
          path: |
            dist/*.AppImage
            dist/*.deb
            dist/*.dmg
            dist/*.exe
            dist/*.zip

  # One job, so there is one release. Only for a tag: a run started by hand
  # leaves its files as artifacts and touches nothing.
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # For the notes, which are prose and live in the repository.
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Everything that was built
        shell: bash
        run: ls -lh dist

      # Created if it is not there and added to if it is, so a re-run of a
      # half-finished release finishes it rather than making a second one.
      - name: Put them on a draft release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --draft \
              --title "${GITHUB_REF_NAME#v}" \
              --notes-file build/release-notes.md
          fi
